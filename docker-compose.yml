services:
  h2o-ai:
    build: .
    container_name: h2o-ai-inference
    ports:
      - "37719:3000"
    environment:
      - PORT=3000
      - H2O_DEBUG=true
      - HEADLESS=true
      - H2O_INSTANCE_KEY=${H2O_INSTANCE_KEY}
    volumes:
      - ./.browser-profile:/app/.browser-profile
      - ./.h2o-memory.json:/app/.h2o-memory.json
      - ./.h2o-instance-key:/app/.h2o-instance-key
    restart: unless-stopped
